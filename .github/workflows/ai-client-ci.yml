name: AI Client CI

on:
  push:
    branches: [main]
    paths:
      - 'ai-client/**'
      - '.github/workflows/ai-client-ci.yml'
  pull_request:
    paths:
      - 'ai-client/**'
      - '.github/workflows/ai-client-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: ai-client/pom.xml

      - name: Test and package AI client
        working-directory: ai-client
        run: mvn -B clean verify
