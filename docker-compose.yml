services:
  postgres:
    image: postgres:17-alpine
    container_name: cloudtask-postgres
    environment:
      POSTGRES_DB: cloudtask
      POSTGRES_USER: cloudtask
      POSTGRES_PASSWORD: cloudtask
    ports:
      - "5432:5432"
    volumes:
      - cloudtask_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cloudtask -d cloudtask"]
      interval: 5s
      timeout: 3s
      retries: 15

  backend:
    build:
      context: ./backend
    container_name: cloudtask-backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/cloudtask
      SPRING_DATASOURCE_USERNAME: cloudtask
      SPRING_DATASOURCE_PASSWORD: cloudtask
      APP_JWT_SECRET: change-this-development-secret-key-with-at-least-32-characters
      APP_CORS_ALLOWED_ORIGINS: http://localhost:5173
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      APP_OAUTH_FRONTEND_REDIRECT: ${APP_OAUTH_FRONTEND_REDIRECT:-http://localhost:5173}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    container_name: cloudtask-frontend
    environment:
      VITE_API_URL: http://localhost:8080
    ports:
      - "5173:80"
    depends_on:
      - backend

  prometheus:
    image: prom/prometheus:v3.14.0
    container_name: cloudtask-prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-lifecycle
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - cloudtask_prometheus:/prometheus
    ports:
      - "9090:9090"
    depends_on:
      - backend

  grafana:
    image: grafana/grafana:13.2.0
    container_name: cloudtask-grafana
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: cloudtask
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - cloudtask_grafana:/var/lib/grafana
      - ./observability/grafana/provisioning/datasources/prometheus.yml:/etc/grafana/provisioning/datasources/prometheus.yml:ro
      - ./observability/grafana/provisioning/dashboards/dashboard.yml:/etc/grafana/provisioning/dashboards/dashboard.yml:ro
      - ./observability/grafana/dashboards/cloudtask-overview.json:/var/lib/grafana/dashboards/cloudtask-overview.json:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus

volumes:
  cloudtask_postgres:
  cloudtask_prometheus:
  cloudtask_grafana:
